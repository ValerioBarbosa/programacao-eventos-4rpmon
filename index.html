<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programação Operacional 4ºRPMon</title>
<meta name="description" content="Agenda de eventos e atividades do 4ºRPMon — 2026.">
<meta property="og:title" content="Programação Operacional 4ºRPMon">
<meta property="og:description" content="Agenda de eventos e atividades do 4ºRPMon — 2026.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<noscript>
  <p style="text-align:center; padding:16px;">
    Esta página precisa de JavaScript habilitado para exibir a agenda de eventos.
  </p>
</noscript>

<header>
  <div class="container cabecalho">
    <div class="identidade">
      <div class="brasao"><img src="image.png" alt="Brasão do 4º RPMon"></div>
      <div>
        <h1>Programação Operacional 4ºRPMon</h1>
        <p class="subtitulo">Agenda de eventos e atividades — 2026</p>
      </div>
    </div>

    <div class="area-acesso">
      <a class="botao-acesso" href="admin.html">Acesso P3</a>

      <div class="mes-cabecalho">
        <label for="mesSelecionado">Mês de referência</label>
        <select id="mesSelecionado">
          <option value="0">Janeiro</option>
          <option value="1">Fevereiro</option>
          <option value="2">Março</option>
          <option value="3">Abril</option>
          <option value="4">Maio</option>
          <option value="5">Junho</option>
          <option value="6">Julho</option>
          <option value="7" selected>Agosto</option>
          <option value="8">Setembro</option>
          <option value="9">Outubro</option>
          <option value="10">Novembro</option>
          <option value="11">Dezembro</option>
        </select>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <div class="aviso-visualizacao">
    Modo visualização. Apenas membros do P3 podem incluir, editar ou excluir eventos.
  </div>

  <section class="painel">
    <div class="campo">
      <label for="pesquisa">Pesquisar evento</label>
      <input id="pesquisa" type="search" placeholder="Ex.: operação, futebol, reunião...">
    </div>
    <div class="campo">
      <label for="filtroTipo">Tipo de evento</label>
      <select id="filtroTipo">
        <option value="todos">Todos os tipos</option>
        <option value="POLOST">01. POLOST</option>
        <option value="Operações">02. Operações</option>
        <option value="Manifestação Social">03. Manifestação Social</option>
        <option value="Jogos de Futebol">04. Jogos de Futebol</option>
        <option value="Passeio a Cavalo">05. Passeio a Cavalo</option>
        <option value="Carnaval">06. Carnaval</option>
        <option value="Cavalgadas">07. Cavalgadas</option>
        <option value="Rodeios">08. Rodeios</option>
        <option value="Dragões, Representações e Outros">09. Dragões, Representações e Outros</option>
        <option value="Clarim, Formaturas e Reuniões">10. Clarim, Formaturas e Reuniões</option>
        <option value="Shows e Eventos">11. Shows e Eventos</option>
        <option value="Empréstimo de VTR ou CAM BOX">12. Empréstimo de VTR ou CAM BOX</option>
        <option value="Transporte de Equinos e Provas">13. Transporte de Equinos e Provas</option>
        <option value="Viagens e Deslocamentos Operacionais">14. Viagens e Deslocamentos Operacionais</option>
      </select>
    </div>
    <div class="campo">
      <label for="filtroEsquadrao">Esquadrão</label>
      <select id="filtroEsquadrao">
        <option value="todos">Todos os esquadrões</option>
        <option value="1">1º Esquadrão</option>
        <option value="2">2º Esquadrão</option>
      </select>
    </div>
    <div class="campo">
      <label for="modoVisualizacao">Visualização</label>
      <select id="modoVisualizacao">
        <option value="dia">Dia</option>
        <option value="semana">Semana</option>
        <option value="mes" selected>Mês</option>
        <option value="ano">Ano</option>
      </select>
    </div>
    <div class="campo campo-data-referencia">
      <label for="dataReferencia">Data de referência</label>
      <input id="dataReferencia" type="date" min="2026-01-01" max="2026-12-31" value="2026-08-09">
    </div>
    <button onclick="exportarPDF()">Gerar PDF</button>
    <button class="botao-whatsapp" onclick="compartilharWhatsApp()">WhatsApp</button>
  </section>

  <div class="resumo">
    <div class="indicador">Ano: <strong>2026</strong></div>
    <div class="indicador">Mês: <strong id="nomeMesResumo">Agosto</strong></div>
    <div class="indicador">Eventos exibidos: <strong id="totalEventos">0</strong></div>
  </div>

  <h2 class="titulo-mes" id="tituloMes">Agosto de 2026</h2>

  <section class="grade-eventos" id="listaEventos" aria-live="polite"></section>
</main>

<footer>Programação Operacional 4ºRPMon — Agenda de eventos de 2026</footer>

<script type="module" src="app.js"></script>
</body>
</html>
