<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel P3 — Programação Operacional 4ºRPMon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container cabecalho">
    <div class="identidade">
      <div class="brasao"><img src="image.png" alt="Brasão do 4º RPMon"></div>
      <div>
        <h1>Programação Operacional 4ºRPMon</h1>
        <p class="subtitulo">Painel de gerenciamento — P3</p>
      </div>
    </div>

    <div class="area-acesso">
      <button class="botao-acesso" id="botaoAcessoP3" onclick="abrirCaixaSenha()">Acesso P3</button>
      <div class="badge-p3" id="badgeP3" style="display:none;">
        Modo P3 ativo
        <button onclick="sairModoP3()">Sair</button>
      </div>
      <a class="botao-acesso" href="index.html">Ver agenda pública</a>

      <div class="mes-cabecalho">
        <label for="mesSelecionado">Mês de referência</label>
        <select id="mesSelecionado">
          <option value="0">Janeiro</option>
          <option value="1">Fevereiro</option>
          <option value="2">Março</option>
          <option value="3">Abril</option>
          <option value="4">Maio</option>
          <option value="5">Junho</option>
          <option value="6">Julho</option>
          <option value="7" selected>Agosto</option>
          <option value="8">Setembro</option>
          <option value="9">Outubro</option>
          <option value="10">Novembro</option>
          <option value="11">Dezembro</option>
        </select>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <section class="painel">
    <div class="campo">
      <label for="pesquisa">Pesquisar evento</label>
      <input id="pesquisa" type="search" placeholder="Ex.: operação, futebol, reunião...">
    </div>
    <div class="campo">
      <label for="filtroTipo">Tipo de evento</label>
      <select id="filtroTipo">
        <option value="todos">Todos os tipos</option>
        <option value="POLOST">01. POLOST</option>
        <option value="Operações">02. Operações</option>
        <option value="Manifestação Social">03. Manifestação Social</option>
        <option value="Jogos de Futebol">04. Jogos de Futebol</option>
        <option value="Passeio a Cavalo">05. Passeio a Cavalo</option>
        <option value="Carnaval">06. Carnaval</option>
        <option value="Cavalgadas">07. Cavalgadas</option>
        <option value="Rodeios">08. Rodeios</option>
        <option value="Dragões, Representações e Outros">09. Dragões, Representações e Outros</option>
        <option value="Clarim, Formaturas e Reuniões">10. Clarim, Formaturas e Reuniões</option>
        <option value="Shows e Eventos">11. Shows e Eventos</option>
        <option value="Empréstimo de VTR ou CAM BOX">12. Empréstimo de VTR ou CAM BOX</option>
        <option value="Transporte de Equinos e Provas">13. Transporte de Equinos e Provas</option>
        <option value="Viagens e Deslocamentos Operacionais">14. Viagens e Deslocamentos Operacionais</option>
      </select>
    </div>
    <button onclick="imprimirAgenda()">Imprimir agenda</button>
    <button class="botao-secundario" onclick="compartilharAgenda()">Compartilhar</button>
  </section>

  <div class="resumo">
    <div class="indicador">Ano: <strong>2026</strong></div>
    <div class="indicador">Mês: <strong id="nomeMesResumo">Agosto</strong></div>
    <div class="indicador">Eventos exibidos: <strong id="totalEventos">0</strong></div>
  </div>

  <h2 class="titulo-mes" id="tituloMes">Agosto de 2026</h2>

  <section class="grade-eventos" id="listaEventos"></section>

  <section class="formulario" id="areaAdministrativa" style="display:none;">
    <h2 id="tituloFormulario">Adicionar evento — P3</h2>
    <div class="form-grid">
      <div class="campo">
        <label for="dataEvento">Data</label>
        <input id="dataEvento" type="date" min="2026-01-01" max="2026-12-31">
      </div>
      <div class="campo">
        <label for="horaEvento">Horário</label>
        <input id="horaEvento" type="time">
      </div>
      <div class="campo">
        <label for="nomeEvento">Evento</label>
        <input id="nomeEvento" type="text" placeholder="Nome do evento">
      </div>
      <div class="campo">
        <label for="localEvento">Local / observação</label>
        <input id="localEvento" type="text" placeholder="Local ou observação">
      </div>
      <div class="campo">
        <label for="tipoEvento">Tipo de evento</label>
        <select id="tipoEvento">
          <option value="POLOST">01. POLOST</option>
          <option value="Operações">02. Operações</option>
          <option value="Manifestação Social">03. Manifestação Social</option>
          <option value="Jogos de Futebol">04. Jogos de Futebol</option>
          <option value="Passeio a Cavalo">05. Passeio a Cavalo</option>
          <option value="Carnaval">06. Carnaval</option>
          <option value="Cavalgadas">07. Cavalgadas</option>
          <option value="Rodeios">08. Rodeios</option>
          <option value="Dragões, Representações e Outros">09. Dragões, Representações e Outros</option>
          <option value="Clarim, Formaturas e Reuniões">10. Clarim, Formaturas e Reuniões</option>
          <option value="Shows e Eventos">11. Shows e Eventos</option>
          <option value="Empréstimo de VTR ou CAM BOX">12. Empréstimo de VTR ou CAM BOX</option>
          <option value="Transporte de Equinos e Provas">13. Transporte de Equinos e Provas</option>
          <option value="Viagens e Deslocamentos Operacionais">14. Viagens e Deslocamentos Operacionais</option>
        </select>
      </div>
      <button id="botaoSalvar" onclick="salvarEvento()">Adicionar</button>
    </div>
    <div class="mensagem" id="mensagem"></div>
  </section>
</main>

<footer>Programação Operacional 4ºRPMon — Painel do P3</footer>

<div class="sobreposicao" id="sobreposicaoSenha">
  <div class="caixa-senha">
    <h3>Acesso restrito — P3</h3>
    <input id="campoSenha" type="password" placeholder="Digite a senha do P3" onkeydown="if(event.key==='Enter') validarSenha()">
    <div class="linha-botoes">
      <button class="botao-cancelar" onclick="fecharCaixaSenha()">Cancelar</button>
      <button onclick="validarSenha()">Entrar</button>
    </div>
  </div>
</div>

<script>
  const SENHA_P3 = "P3agenda2026";

  function abrirCaixaSenha() {
    document.getElementById("sobreposicaoSenha").style.display = "flex";
    document.getElementById("campoSenha").focus();
  }

  function fecharCaixaSenha() {
    document.getElementById("sobreposicaoSenha").style.display = "none";
    document.getElementById("campoSenha").value = "";
  }

  function validarSenha() {
    const senhaDigitada = document.getElementById("campoSenha").value;

    if (senhaDigitada === SENHA_P3) {
      sessionStorage.setItem("p3_autorizado", "true");
      ativarModoP3();
      fecharCaixaSenha();
    } else {
      alert("Senha incorreta.");
    }
  }

  function sairModoP3() {
    sessionStorage.removeItem("p3_autorizado");
    location.reload();
  }

  function ativarModoP3() {
    document.getElementById("botaoAcessoP3").style.display = "none";
    document.getElementById("badgeP3").style.display = "flex";
    const area = document.getElementById("areaAdministrativa");
    if (area) area.style.display = "block";
  }

  window.abrirCaixaSenha = abrirCaixaSenha;
  window.fecharCaixaSenha = fecharCaixaSenha;
  window.validarSenha = validarSenha;
  window.sairModoP3 = sairModoP3;

  document.addEventListener("DOMContentLoaded", () => {
    if (sessionStorage.getItem("p3_autorizado") === "true") {
      ativarModoP3();
    }
  });
</script>

<script type="module" src="app.js"></script>
</body>
</html>
